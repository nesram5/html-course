packages:
  - apps/*
  - packages/*

# pnpm 10 does not run dependency install scripts unless they are allow-listed.
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - prisma

# Security overrides of transitive dependencies (keep `pnpm audit --prod --audit-level high` clean).
overrides:
  # GHSA-ggr8-5vv4-36mx, pulled by prisma → @prisma/config.
  deepmerge-ts: ^8.0.0
