# Plaza CI (E0-S6, standards §9): lint → typecheck → unit + integration tests → build → validate:maps.
# E2E runs on main and on PRs labelled "e2e".
name: Plaza CI

on:
  pull_request:
    paths:
      - "plaza/**"
      - ".github/workflows/plaza-ci.yml"
  push:
    branches: [main]
    paths:
      - "plaza/**"
      - ".github/workflows/plaza-ci.yml"

concurrency:
  group: plaza-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: plaza

env:
  HUSKY: "0"
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/plaza_test

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: plaza_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: plaza/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: plaza/.nvmrc
          cache: pnpm
          cache-dependency-path: plaza/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Coverage of @plaza/shared (>= 90 % lines)
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Validate maps
        run: pnpm validate:maps

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
        continue-on-error: true

  e2e:
    name: E2E (Playwright)
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'e2e')
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: plaza_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/plaza_e2e
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: plaza/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: plaza/.nvmrc
          cache: pnpm
          cache-dependency-path: plaza/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Start LiveKit (dev mode)
        run: docker run -d --name livekit -p 7880:7880 -p 7881:7881 -p 7882:7882/udp livekit/livekit-server:v1.9 --dev --bind 0.0.0.0

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: plaza/e2e/playwright-report
          retention-days: 7
