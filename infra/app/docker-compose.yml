# Plaza app VM (E8-S5, architecture §11.4): Caddy + web, server, and optionally PostgreSQL with
# a daily backup. The media server (LiveKit + TURN) runs on its own VM: infra/livekit/.
#
#   cp .env.production.example .env   # fill it in (never commit .env)
#   docker compose --profile db up -d  # with the bundled PostgreSQL + daily pg_dump
#   docker compose up -d               # with a managed PostgreSQL (DATABASE_URL in .env)
#
# Every `up` runs `migrate` (prisma migrate deploy) before starting the server, but it recreates
# changed containers first: a failed migration inside `up` leaves server and web stopped. So
# deploy.sh runs `docker compose run --rm migrate` on its own first and only then `up`.
# Deploy, rollback, restore and key rotation: docs/runbook.md.
name: bululu

x-server-image: &server-image ${BULULU_SERVER_IMAGE:-bululu-server:local}

services:
  migrate:
    image: *server-image
    command: ['migrate']
    env_file: .env
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: 'no'

  server:
    image: *server-image
    command: ['serve']
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      # Caddy is the only proxy in front: it replaces X-Forwarded-For with the real peer.
      TRUST_PROXY: '1'
    depends_on:
      migrate:
        condition: service_completed_successfully
    # The server handles SIGTERM itself (closes realtime connections, exits within 8 s).
    init: true
    stop_grace_period: 15s
    restart: unless-stopped
    expose: ['3000']
    logging: &logging
      driver: json-file
      options: { max-size: '20m', max-file: '5' }

  web:
    image: ${BULULU_WEB_IMAGE:-bululu-web:local}
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      SERVER_UPSTREAM: server:3000
      CSP_CONNECT_SRC: ${CSP_CONNECT_SRC:-}
    ports:
      - '${BULULU_HTTP_PORT:-80}:80'
      - '${BULULU_HTTPS_PORT:-443}:443'
      - '${BULULU_HTTPS_PORT:-443}:443/udp'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      server:
        condition: service_started
    restart: unless-stopped
    logging: *logging

  postgres:
    profiles: ['db']
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bululu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: bululu
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bululu -d bululu']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging

  backup:
    profiles: ['db']
    image: postgres:16-alpine
    entrypoint: ['/bin/sh', '/usr/local/bin/bululu-backup']
    environment:
      PGHOST: postgres
      PGUSER: bululu
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
      PGDATABASE: bululu
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_ON_START: ${BACKUP_ON_START:-0}
    volumes:
      - ./backup.sh:/usr/local/bin/bululu-backup:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
