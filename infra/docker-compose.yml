# Local services for Bululu (E0-S5).
#   pnpm infra:up          → PostgreSQL 16
#   pnpm infra:up:livekit  → PostgreSQL 16 + LiveKit server in dev mode (key "devkey", secret "secret")
# Host ports can be changed with BULULU_PG_PORT / BULULU_LIVEKIT_PORT if they are already taken.
# Its own project name: the app stack of infra/app is `bululu`, and sharing it on one Docker host
# would mix containers and the Postgres volume of both.
name: bululu-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bululu_dev
    ports:
      - '${BULULU_PG_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d bululu_dev']
      interval: 2s
      timeout: 3s
      retries: 30

  livekit:
    profiles: ['livekit']
    image: livekit/livekit-server:v1.9
    # --dev: API key "devkey", secret "secret", no TURN. Never use in production (see E5-S7).
    command: ['--dev', '--bind', '0.0.0.0']
    environment:
      # Signed webhooks to the dev server on the host, as on the media VM (E6-S3). Set
      # BULULU_API_PORT when the server does not listen on 3000; if it is down LiveKit only logs.
      LIVEKIT_CONFIG: |
        webhook:
          api_key: devkey
          urls:
            - http://host.docker.internal:${BULULU_API_PORT:-3000}/api/media/livekit-webhook
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${BULULU_LIVEKIT_PORT:-7880}:7880'
      - '7881:7881'
      - '7882:7882/udp'

volumes:
  postgres-data:
