# Self-hosted media server for staging and beta (E5-S7, architecture §11.5): LiveKit with its
# embedded TURN, behind Caddy for the certificates. Runs alone on the media VM.
#
#   cp .env.example .env && $EDITOR .env      # keys and domains (never versioned)
#   ./render-config.sh                         # caddy.yaml and livekit.yaml from their .tmpl
#   docker compose up -d
#
# Both services use the host network (no NAT in front of the media) and restart with the VM.
# Versions are pinned: upgrades are manual and documented (docs/runbook.md).
name: plaza-media

services:
  livekit:
    image: livekit/livekit-server:v1.9.12
    command: ['--config', '/etc/livekit.yaml']
    network_mode: host
    restart: unless-stopped
    environment:
      # "<key>: <secret>", the same pair as LIVEKIT_API_KEY / LIVEKIT_API_SECRET of the app server.
      LIVEKIT_KEYS: '${LIVEKIT_API_KEY:?set it in .env}: ${LIVEKIT_API_SECRET:?set it in .env}'
      LIVEKIT_TURN_DOMAIN: '${TURN_DOMAIN:?set it in .env}'
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    healthcheck:
      # LiveKit answers "OK" on its HTTP port.
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1:7880/']
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    # Caddy built with the layer4 module (TLS routing by SNI on TCP 443), as generated by
    # livekit/generate. Pin it to the digest pulled on the first deploy (see docs/runbook.md).
    image: '${CADDY_L4_IMAGE:-livekit/caddyl4}'
    command: ['caddy', 'run', '--config', '/etc/caddy.yaml', '--adapter', 'yaml']
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./caddy.yaml:/etc/caddy.yaml:ro
      - caddy-data:/data

volumes:
  caddy-data:
